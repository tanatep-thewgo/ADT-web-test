<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style2.css">

    <div class="hero-banner">
        <a href="rte.html" class="back-button">
            <img src="img/Go Back.svg" alt="Go Back">

        <div class="item-card">
            <img src="img/9883be63-9f33-441c-ae55-eee75573161c.765af5b81ef52496ef54b8b1565c4dc7-removebg-preview 1.svg" alt="Oculus Quest 2" class="item-image">

    <div class="action-container">
        <div class="notes-field">

            <button type="button" class="btn btn-borrow" onclick="window.location.href='2_return4.html'">Return</button>
